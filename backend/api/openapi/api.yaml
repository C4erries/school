                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integrations/calendar/settings:
    get:
      summary: Получение персональных настроек и ссылок синхронизации календаря
      operationId: getCalendarSettings
      tags:
        - Integrations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Персональные настройки и ссылки на календарь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSettingsResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integrations/calendar/rotate-token:
    post:
      summary: Перевыпуск персонального токена синхронизации календаря
      operationId: rotateCalendarToken
      tags:
        - Integrations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Обновленные настройки с новым токеном
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSettingsResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integrations/calendar/export:
    get:
      summary: Разовый экспорт расписания в файл iCalendar (.ics)
      operationId: exportCalendarFile
      tags:
        - Integrations
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Файл iCalendar (.ics)
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integrations/calendar/feed.ics:
    get:
      summary: Публичный Live Feed расписания для Google/Apple Calendar подписки (RFC 5545)
      operationId: getCalendarFeed
      tags:
        - Integrations
      parameters:
        - name: token
          in: query
          required: true
          description: Персональный секретный UUID-токен преподавателя
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: iCalendar поток событий расписания
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '401':
          description: Недействительный или отозванный токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /integrations/calendar/import:
    post:
      summary: Импорт расписания из файла Google Календаря (.ics)
      operationId: importCalendarFile
      tags:
        - Integrations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл календаря формата iCalendar (.ics)
      responses:
        '200':
          description: Результат импорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarImportResponse'
        '400':
          description: Некорректный или поврежденный файл iCalendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Введите access_token в формате Bearer <token>

  schemas:
    Role:
      type: string
      enum:
        - student
        - teacher
        - assistant
        - owner
      example: student

    UserResponse:
      type: object
      required:
        - id
        - email
        - full_name
        - role
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        email:
          type: string
          format: email
          example: student@school.ru
        full_name:
          type: string
          example: Иван Иванов
        phone:
          type: string
          nullable: true
          example: '+79991234567'
        role:
          $ref: '#/components/schemas/Role'
        default_rate_individual:
          type: number
          nullable: true
          example: 1500
        default_rate_pair:
          type: number
          nullable: true
          example: 1000
        default_rate_group:
          type: number
          nullable: true
          example: 700
        created_at:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'

    UserDefaultRates:
      type: object
      required:
        - rate_individual
        - rate_pair
        - rate_group
      properties:
        rate_individual:
          type: number
          example: 1500
        rate_pair:
          type: number
          example: 1000
        rate_group:
          type: number
          example: 700

    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: 9b2d3c1a-5f8e-4a7b-9c2d-3e4f5a6b7c8d
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Время жизни access_token в секундах
          example: 900

    AuthResponse:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: user@school.ru
        password:
          type: string
          minLength: 6
          example: securePassword123
        full_name:
          type: string
          minLength: 2
          example: Иван Иванов
        phone:
          type: string
          nullable: true
          example: '+79991234567'
        role:
          $ref: '#/components/schemas/Role'
          default: student

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@school.ru
        password:
          type: string
          example: securePassword123

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: 9b2d3c1a-5f8e-4a7b-9c2d-3e4f5a6b7c8d

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - service
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'
        service:
          type: string
          example: school-api
        version:
          type: string
          example: v1

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input parameters
        details:
          type: array
          items:
            type: object
            additionalProperties: true

    ClassroomResponse:
      type: object
      required:
        - id
        - name
        - capacity
        - color
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          example: 'Кабинет №1 (Физика)'
        capacity:
          type: integer
          example: 4
        color:
          type: string
          example: '#3B82F6'
        description:
          type: string
          nullable: true
          example: 'Оснащен маркерной доской и микроскопом'
        created_at:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'

    CreateClassroomRequest:
      type: object
      required:
        - name
        - capacity
      properties:
        name:
          type: string
          minLength: 2
          example: 'Кабинет №1'
        capacity:
          type: integer
          minimum: 1
          example: 4
        color:
          type: string
          nullable: true
          example: '#3B82F6'
        description:
          type: string
          nullable: true
          example: 'Основной кабинет математики'

    LessonFormat:
      type: string
      enum:
        - individual
        - pair
        - group
      example: individual

    LessonStatus:
      type: string
      enum:
        - scheduled
        - completed
        - cancelled
      example: scheduled

    LessonResponse:
      type: object
      required:
        - id
        - teacher_id
        - client_id
        - title
        - start_time
        - end_time
        - format
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        teacher_id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174001'
        client_id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174002'
        title:
          type: string
          example: 'Подготовка к ОГЭ'
        classroom_id:
          type: string
          format: uuid
          nullable: true
          example: '123e4567-e89b-12d3-a456-426614174003'
        start_time:
          type: string
          format: date-time
          example: '2026-10-05T10:00:00Z'
        end_time:
          type: string
          format: date-time
          example: '2026-10-05T11:00:00Z'
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
          example: 'Кабинет №1'
        status:
          $ref: '#/components/schemas/LessonStatus'
        notes:
          type: string
          nullable: true
          example: 'Подготовить ДЗ №3'
        cancel_reason:
          type: string
          nullable: true
          example: 'Ученик заболел'
        created_at:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'
        is_recurring:
          type: boolean
          example: false
        series_id:
          type: string
          format: uuid
          nullable: true
          example: '123e4567-e89b-12d3-a456-426614174009'

    CreateLessonRequest:
      type: object
      required:
        - client_id
        - title
        - start_time
        - end_time
        - format
      properties:
        title:
          type: string
          example: 'Подготовка к ОГЭ'
        client_id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174002'
        classroom_id:
          type: string
          format: uuid
          nullable: true
          example: '123e4567-e89b-12d3-a456-426614174003'
        start_time:
          type: string
          format: date-time
          example: '2026-10-05T10:00:00Z'
        end_time:
          type: string
          format: date-time
          example: '2026-10-05T11:00:00Z'
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
          example: 'https://zoom.us/j/123456789'
        notes:
          type: string
          nullable: true
          example: 'Тема: Квадратные уравнения'

    RecurrenceScope:
      type: string
      enum:
        - this_only
        - this_and_following
        - all_in_series
      example: this_only

    CancelLessonRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          example: 'Форс-мажор'
        scope:
          $ref: '#/components/schemas/RecurrenceScope'

    UpdateLessonRequest:
      type: object
      properties:
        title:
          type: string
          example: 'Подготовка к ОГЭ'
        client_id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
          nullable: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        cancel_reason:
          type: string
          nullable: true
        scope:
          $ref: '#/components/schemas/RecurrenceScope'

    LessonSeriesResponse:
      type: object
      required:
        - id
        - teacher_id
        - client_id
        - title
        - rrule
        - start_time_of_day
        - duration_minutes
        - format
        - start_date
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        teacher_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: 'Регулярная математика'
        rrule:
          type: string
          example: 'FREQ=WEEKLY;BYDAY=TU,TH'
        start_time_of_day:
          type: string
          example: '17:00'
        duration_minutes:
          type: integer
          example: 60
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          example: '2026-10-01'
        until_date:
          type: string
          format: date
          nullable: true
          example: '2027-05-31'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateLessonSeriesRequest:
      type: object
      required:
        - client_id
        - title
        - rrule
        - start_time_of_day
        - duration_minutes
        - format
        - start_date
      properties:
        client_id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: 'Регулярная математика'
        rrule:
          type: string
          example: 'FREQ=WEEKLY;BYDAY=TU,TH'
        start_time_of_day:
          type: string
          example: '17:00'
        duration_minutes:
          type: integer
          example: 60
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          example: '2026-10-01'
        until_date:
          type: string
          format: date
          nullable: true
          example: '2027-05-31'

    UpdateLessonSeriesRequest:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          example: 'Регулярная математика'
        rrule:
          type: string
          example: 'FREQ=WEEKLY;BYDAY=TU,TH'
        start_time_of_day:
          type: string
          example: '17:00'
        duration_minutes:
          type: integer
          example: 60
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        until_date:
          type: string
          format: date
          nullable: true
          example: '2027-05-31'

    CalendarImportResponse:
      type: object
      required:
        - imported_lessons
        - imported_series
        - skipped_events
      properties:
        imported_lessons:
          type: integer
          example: 12
        imported_series:
          type: integer
          example: 2
        skipped_events:
          type: integer
          example: 1
        message:
          type: string
          example: 'Успешно импортировано'

    ClientBalances:
      type: object
      required:
        - individual_hours
        - pair_hours
        - group_hours
        - total_hours
      properties:
        individual_hours:
          type: number
          example: 8.5
        pair_hours:
          type: number
          example: 4.0
        group_hours:
          type: number
          example: 0.0
        total_hours:
          type: number
          example: 12.5

    TagResponse:
      type: object
      required:
        - id
        - teacher_id
        - name
        - school_percent
        - color
        - created_at
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        name:
          type: string
          example: 'Школа №12'
        school_percent:
          type: integer
          example: 30
        color:
          type: string
          example: 'indigo'
        created_at:
          type: string
          format: date-time

    CreateTagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: 'Школа №12'
        school_percent:
          type: integer
          default: 0
          minimum: 0
          maximum: 100
          example: 30
        color:
          type: string
          default: 'indigo'
          example: 'indigo'

    AssignTagRequest:
      type: object
      required:
        - tag_id
      properties:
        tag_id:
          type: string
          format: uuid

    ClientResponse:
      type: object
      required:
        - id
        - teacher_id
        - name
        - rate_individual
        - is_archived
        - tags
        - balances
        - created_at
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        base_rate:
          type: number
          nullable: true
        rate_individual:
          type: number
          example: 1500
        rate_pair:
          type: number
          nullable: true
          example: 1000
        rate_group:
          type: number
          nullable: true
          example: 800
        school_percent_tag:
          type: integer
          nullable: true
        is_archived:
          type: boolean
          default: false
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
        balances:
          $ref: '#/components/schemas/ClientBalances'
        created_at:
          type: string
          format: date-time

    CreateClientRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        phone:
          type: string
