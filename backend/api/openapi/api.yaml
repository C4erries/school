openapi: 3.0.3
info:
  title: School API
  description: API для платформы онлайн/оффлайн школы и помощника репетитора.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Основной шлюз API

paths:
  /health:
    get:
      summary: Проверка работоспособности сервиса
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Сервис работает штатно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      summary: Регистрация нового пользователя
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Пользователь с таким email уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Аутентификация по email и паролю
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Обновление пары токенов по refresh_token
      operationId: refreshTokens
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Невалидный или отозванный refresh токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Получение данных текущего авторизованного пользователя
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /classrooms:
    get:
      summary: Получение списка учебных кабинетов
      operationId: listClassrooms
      tags:
        - Classrooms
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список кабинетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassroomResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Создание нового учебного кабинета
      operationId: createClassroom
      tags:
        - Classrooms
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassroomRequest'
      responses:
        '201':
          description: Кабинет успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clients:
    get:
      summary: Список клиентов
      operationId: listClients
      tags:
        - Clients
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'
    post:
      summary: Создание клиента
      operationId: createClient
      tags:
        - Clients
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'

  /clients/{id}/subscriptions:
    get:
      summary: Список абонементов
      operationId: listSubscriptions
      tags:
        - Clients
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionResponse'
    post:
      summary: Создание абонемента
      operationId: createSubscription
      tags:
        - Clients
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /clients/{id}:
    get:
      summary: Получение клиента по ID
      operationId: getClient
      tags:
        - Clients
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Редактирование клиента
      operationId: updateClient
      tags:
        - Clients
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Удаление клиента
      operationId: deleteClient
      tags:
        - Clients
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Успешно удален
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clients/{id}/tags:
    post:
      summary: Привязать тег к клиенту
      operationId: assignClientTag
      tags:
        - Clients
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTagRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Клиент или тег не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clients/{id}/tags/{tag_id}:
    delete:
      summary: Отвязать тег от клиента
      operationId: removeClientTag
      tags:
        - Clients
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tags:
    get:
      summary: Список тегов преподавателя
      operationId: listTags
      tags:
        - Tags
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Создание нового тега
      operationId: createTag
      tags:
        - Tags
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Тег успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tags/{id}:
    delete:
      summary: Удаление тега
      operationId: deleteTag
      tags:
        - Tags
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Тег успешно удален
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Тег не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dashboard/metrics:
    get:
      summary: Метрики дашборда
      operationId: getDashboardMetrics
      tags:
        - Dashboard
      security:
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetricsResponse'

  /lessons:
    get:
      summary: Список уроков с фильтрацией
      operationId: listLessons
      tags:
        - Lessons
      security:
        - BearerAuth: []
      parameters:
        - name: teacher_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: client_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: classroom_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LessonStatus'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Список уроков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Назначение урока преподавателем
      operationId: createLesson
      tags:
        - Lessons
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
      responses:
        '201':
          description: Урок успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Коллизия кабинета или наложение времени
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /lessons/{id}:
    patch:
      summary: Редактирование урока
      operationId: updateLesson
      tags:
        - Lessons
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
      responses:
        '200':
          description: Урок успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Урок не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Коллизия кабинета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lessons/{id}/complete:
    post:
      summary: Завершение проведенного урока преподавателем
      operationId: completeLesson
      tags:
        - Lessons
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Урок успешно завершен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          description: Некорректный статус урока для завершения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Урок не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lessons/{id}/cancel:
    post:
      summary: Отмена урока
      operationId: cancelLesson
      tags:
        - Lessons
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelLessonRequest'
      responses:
        '200':
          description: Урок успешно отменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonResponse'
        '400':
          description: Некорректный статус урока для отмены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Урок не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Введите access_token в формате Bearer <token>

  schemas:
    Role:
      type: string
      enum:
        - student
        - teacher
        - assistant
        - owner
      example: student

    UserResponse:
      type: object
      required:
        - id
        - email
        - full_name
        - role
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        email:
          type: string
          format: email
          example: student@school.ru
        full_name:
          type: string
          example: Иван Иванов
        phone:
          type: string
          nullable: true
          example: '+79991234567'
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'

    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: 9b2d3c1a-5f8e-4a7b-9c2d-3e4f5a6b7c8d
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Время жизни access_token в секундах
          example: 900

    AuthResponse:
      type: object
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - full_name
      properties:
        email:
          type: string
          format: email
          example: user@school.ru
        password:
          type: string
          minLength: 6
          example: securePassword123
        full_name:
          type: string
          minLength: 2
          example: Иван Иванов
        phone:
          type: string
          nullable: true
          example: '+79991234567'
        role:
          $ref: '#/components/schemas/Role'
          default: student

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@school.ru
        password:
          type: string
          example: securePassword123

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: 9b2d3c1a-5f8e-4a7b-9c2d-3e4f5a6b7c8d

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - service
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'
        service:
          type: string
          example: school-api
        version:
          type: string
          example: v1

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input parameters
        details:
          type: array
          items:
            type: object
            additionalProperties: true

    ClassroomResponse:
      type: object
      required:
        - id
        - name
        - capacity
        - color
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          example: 'Кабинет №1 (Физика)'
        capacity:
          type: integer
          example: 4
        color:
          type: string
          example: '#3B82F6'
        description:
          type: string
          nullable: true
          example: 'Оснащен маркерной доской и микроскопом'
        created_at:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'

    CreateClassroomRequest:
      type: object
      required:
        - name
        - capacity
      properties:
        name:
          type: string
          minLength: 2
          example: 'Кабинет №1'
        capacity:
          type: integer
          minimum: 1
          example: 4
        color:
          type: string
          nullable: true
          example: '#3B82F6'
        description:
          type: string
          nullable: true
          example: 'Основной кабинет математики'

    LessonFormat:
      type: string
      enum:
        - individual
        - pair
        - group
      example: individual

    LessonStatus:
      type: string
      enum:
        - scheduled
        - completed
        - cancelled
      example: scheduled

    LessonResponse:
      type: object
      required:
        - id
        - teacher_id
        - client_id
        - start_time
        - end_time
        - format
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174000'
        teacher_id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174001'
        client_id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174002'
        classroom_id:
          type: string
          format: uuid
          nullable: true
          example: '123e4567-e89b-12d3-a456-426614174003'
        start_time:
          type: string
          format: date-time
          example: '2026-10-05T10:00:00Z'
        end_time:
          type: string
          format: date-time
          example: '2026-10-05T11:00:00Z'
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
          example: 'Кабинет №1'
        status:
          $ref: '#/components/schemas/LessonStatus'
        notes:
          type: string
          nullable: true
          example: 'Подготовить ДЗ №3'
        cancel_reason:
          type: string
          nullable: true
          example: 'Ученик заболел'
        created_at:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'

    CreateLessonRequest:
      type: object
      required:
        - client_id
        - start_time
        - end_time
        - format
      properties:
        client_id:
          type: string
          format: uuid
          example: '123e4567-e89b-12d3-a456-426614174002'
        classroom_id:
          type: string
          format: uuid
          nullable: true
          example: '123e4567-e89b-12d3-a456-426614174003'
        start_time:
          type: string
          format: date-time
          example: '2026-10-05T10:00:00Z'
        end_time:
          type: string
          format: date-time
          example: '2026-10-05T11:00:00Z'
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
          example: 'https://zoom.us/j/123456789'
        notes:
          type: string
          nullable: true
          example: 'Тема: Квадратные уравнения'

    CancelLessonRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          example: 'Форс-мажор'

    UpdateLessonRequest:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
        classroom_id:
          type: string
          format: uuid
          nullable: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        format:
          $ref: '#/components/schemas/LessonFormat'
        location_or_url:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        cancel_reason:
          type: string
          nullable: true

    ClientBalances:
      type: object
      required:
        - individual_hours
        - pair_hours
        - group_hours
        - total_hours
      properties:
        individual_hours:
          type: number
          example: 8.5
        pair_hours:
          type: number
          example: 4.0
        group_hours:
          type: number
          example: 0.0
        total_hours:
          type: number
          example: 12.5

    TagResponse:
      type: object
      required:
        - id
        - teacher_id
        - name
        - school_percent
        - color
        - created_at
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        name:
          type: string
          example: 'Школа №12'
        school_percent:
          type: integer
          example: 30
        color:
          type: string
          example: 'indigo'
        created_at:
          type: string
          format: date-time

    CreateTagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: 'Школа №12'
        school_percent:
          type: integer
          default: 0
          minimum: 0
          maximum: 100
          example: 30
        color:
          type: string
          default: 'indigo'
          example: 'indigo'

    AssignTagRequest:
      type: object
      required:
        - tag_id
      properties:
        tag_id:
          type: string
          format: uuid

    ClientResponse:
      type: object
      required:
        - id
        - teacher_id
        - name
        - rate_individual
        - tags
        - balances
        - created_at
      properties:
        id:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        base_rate:
          type: number
          nullable: true
        rate_individual:
          type: number
          example: 1500
        rate_pair:
          type: number
          nullable: true
          example: 1000
        rate_group:
          type: number
          nullable: true
          example: 800
        school_percent_tag:
          type: integer
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'
        balances:
          $ref: '#/components/schemas/ClientBalances'
        created_at:
          type: string
          format: date-time

    CreateClientRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        phone:
          type: string
          nullable: true
        base_rate:
          type: number
          nullable: true
        rate_individual:
          type: number
          example: 1500
        rate_pair:
          type: number
          nullable: true
          example: 1000
        rate_group:
          type: number
          nullable: true
          example: 800
        school_percent_tag:
          type: integer
          default: 0
        tag_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateClientRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
          nullable: true
        rate_individual:
          type: number
        rate_pair:
          type: number
          nullable: true
        rate_group:
          type: number
          nullable: true
        tag_ids:
          type: array
          items:
            type: string
            format: uuid

    SubscriptionResponse:
      type: object
      required:
        - id
        - client_id
        - format
        - balance
        - created_at
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        format:
          type: string
          enum:
            - individual
            - pair
            - group
          example: individual
        balance:
          type: number
          example: 10.0
        created_at:
          type: string
          format: date-time

    CreateSubscriptionRequest:
      type: object
      required:
        - balance
      properties:
        format:
          type: string
          enum:
            - individual
            - pair
            - group
          example: individual
        type:
          type: string
          example: individual
        balance:
          type: number
          example: 10.0

    DashboardMetricsResponse:
      type: object
      required:
        - gross_potential_revenue
        - net_income
        - average_rate
      properties:
        gross_potential_revenue:
          type: number
        net_income:
          type: number
        average_rate:
          type: number

